<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eBay 파인더 — 상품 발굴 도구</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#1e3a37;min-height:100vh;color:#fff}

/* 로그인 */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-box{background:#2e5f5a;border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.auth-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.6}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
.auth-field input{width:100%;padding:11px 16px;border:1.5px solid rgba(255,255,255,.15);border-radius:50px;font-size:14px;color:#fff;background:rgba(255,255,255,.1);outline:none}
.auth-field input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.auth-field input::placeholder{color:rgba(255,255,255,.3)}
.auth-btn{width:100%;padding:13px;background:#fff;color:#2e5f5a;border:none;border-radius:50px;font-size:14px;font-weight:900;cursor:pointer;margin-top:4px}
.auth-btn:hover{background:#e8f5ee}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-msg{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:12px;text-align:center;display:none}
.auth-msg.err{background:rgba(229,85,85,.2);border:1px solid rgba(229,85,85,.4);color:#ffaaaa}
.auth-msg.warn{background:rgba(255,193,7,.15);border:1px solid rgba(255,193,7,.3);color:#ffe082}
.auth-link{font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:16px}
.auth-link a{color:#9fd9c7;text-decoration:none}

/* 메인 앱 */
.app{display:none;grid-template-columns:340px 1fr;min-height:100vh}
.left{background:#2e5f5a;padding:24px 22px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.logo-text{font-size:18px;font-weight:900;letter-spacing:-.3px}
.logo-sub{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:20px;line-height:1.5}
.user-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.15);border-radius:50px;padding:6px 14px;margin-bottom:18px}
.user-bar span{font-size:12px;font-weight:700;color:rgba(255,255,255,.7)}
.logout-btn{font-size:11px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;text-decoration:underline}
.logout-btn:hover{color:#fff}

.sec-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.add-kw-box{background:rgba(0,0,0,.18);border-radius:14px;padding:14px;margin-bottom:14px}
.field{margin-bottom:9px}
.field label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.field input,.field select{width:100%;padding:9px 14px;border:1.5px solid rgba(255,255,255,.15);border-radius:50px;font-size:13px;color:#fff;background:rgba(255,255,255,.1);outline:none;-webkit-appearance:none}
.field input:focus{border-color:rgba(255,255,255,.5)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{width:100%;padding:11px;background:#fff;color:#2e5f5a;border:none;border-radius:50px;font-size:13px;font-weight:900;cursor:pointer;transition:all .2s}
.btn:hover{background:#e8f5ee}
.btn-sec{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.25)}
.btn-sec:hover{background:rgba(255,255,255,.25)}

.kw-list{display:flex;flex-direction:column;gap:6px}
.kw-card{background:rgba(0,0,0,.15);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kw-card.inactive{opacity:.5}
.kw-info{flex:1;min-width:0}
.kw-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-meta{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.kw-actions{display:flex;gap:4px;flex-shrink:0}
.kw-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.kw-btn:hover{background:rgba(255,255,255,.25);color:#fff}
.kw-btn.danger:hover{background:rgba(255,80,80,.3);color:#ffaaaa}

/* 우측 */
.right{background:#f4f6f4;padding:24px 28px;overflow-y:auto}
.right-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:18px;font-weight:900;color:#222}
.page-sub{font-size:12px;color:#888;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center}

.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-label{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:22px;font-weight:900;color:#222;letter-spacing:-.5px}
.stat-val.green{color:#2d6a4f}

.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fbtn{padding:5px 14px;border:1.5px solid #ddd;background:#fff;color:#555;font-size:11px;font-weight:700;border-radius:20px;cursor:pointer}
.fbtn.active{background:#2e5f5a;color:#fff;border-color:#2e5f5a}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.item-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .15s}
.item-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.item-thumb{width:100%;height:160px;background:#f0f0f0;object-fit:contain;display:block}
.item-body{padding:12px 14px}
.item-score{display:inline-block;background:#2e5f5a;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.item-title{font-size:13px;font-weight:700;color:#222;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px;margin-bottom:8px}
.item-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-bottom:8px}
.item-stat{background:#f8f9f8;border-radius:8px;padding:5px 8px}
.item-stat-label{color:#888;font-size:9px;text-transform:uppercase}
.item-stat-val{color:#222;font-weight:700;font-size:12px}
.item-kr{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.item-kr.low{background:#e8f5ee;color:#2d6a4f}
.item-kr.mid{background:#fff3e0;color:#b5621e}
.item-kr.high{background:#ffeaea;color:#e55}
.item-actions{display:flex;gap:6px;margin-top:8px;border-top:1px solid #f0f0f0;padding-top:8px}
.iact{flex:1;padding:5px;background:#f8f9f8;border:none;border-radius:8px;font-size:11px;font-weight:700;color:#555;cursor:pointer}
.iact:hover{background:#e8f5ee;color:#2d6a4f}
.iact.fav{color:#e8a020}
.iact.fav.active{background:#fff8e1;color:#e8a020}

.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
.empty-em{font-size:48px;margin-bottom:12px;opacity:.5}

.run-info{background:#fff;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.run-info-text{font-size:12px;color:#555}
.run-info-time{font-weight:800;color:#222}

.search-box{flex:1;max-width:260px;padding:8px 14px;border:1.5px solid #ddd;border-radius:50px;font-size:13px;background:#fff;color:#222;outline:none}
.search-box:focus{border-color:#2e5f5a}

@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .left{padding:18px 14px}
  .right{padding:18px 14px}
  .stat-cards{grid-template-columns:1fr 1fr}
  .items-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<div class="auth-wrap" id="auth_wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <span style="font-size:30px;font-weight:900;font-family:Georgia,serif;letter-spacing:-1px;line-height:1">
        <span style="color:#E53238">e</span><span style="color:#0064D2">B</span><span style="color:#F5AF02">a</span><span style="color:#86B817">y</span>
      </span>
      <span style="font-size:22px;font-weight:800">파인더 <span style="color:#9fd9c7">🔍</span></span>
    </div>
    <div class="auth-sub">🔍 키워드 기반 상품 발굴 도구<br>셀러박스 계정으로 로그인하세요</div>

    <div class="auth-field">
      <label>아이디</label>
      <input type="text" id="login_id" placeholder="셀러박스 아이디" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="auth-field">
      <label>비밀번호</label>
      <input type="password" id="login_pw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="auth-btn" onclick="doLogin()" id="login_btn">로그인</button>
    <div class="auth-msg" id="login_msg"></div>
    <div class="auth-link">
      계정이 없으신가요? <a href="https://burgerwang.vercel.app/" target="_blank">셀러박스 본체</a>에서 가입하세요
    </div>
  </div>
</div>

<!-- ══════════ 메인 앱 ══════════ -->
<div class="app" id="main_app">

  <!-- 좌측 사이드바 -->
  <div class="left">
    <div class="logo">
      <span style="font-size:24px;font-weight:900;font-family:Georgia,serif;letter-spacing:-1px;line-height:1">
        <span style="color:#E53238">e</span><span style="color:#0064D2">B</span><span style="color:#F5AF02">a</span><span style="color:#86B817">y</span>
      </span>
      <span class="logo-text">파인더</span>
    </div>
    <div class="logo-sub">키워드 추적 · 발굴 · 점수화</div>

    <div class="user-bar">
      <span id="current_user_label">👤 -</span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>

    <div class="sec-title">+ 키워드 추가</div>
    <div class="add-kw-box">
      <div class="field">
        <label>키워드 *</label>
        <input type="text" id="new_kw" placeholder="예: Nike Air Force 1">
      </div>
      <div class="field">
        <label>분류 (선택)</label>
        <input type="text" id="new_cat" placeholder="예: 신발">
      </div>
      <div class="g2">
        <div class="field" style="margin:0"><label>최소가 ($)</label><input type="number" id="new_min" placeholder="30"></div>
        <div class="field" style="margin:0"><label>최대가 ($)</label><input type="number" id="new_max" placeholder="500"></div>
      </div>
      <button class="btn" style="margin-top:8px" onclick="addKeyword()">+ 추가</button>
    </div>

    <div class="sec-title">
      <span>📋 추적 중인 키워드 <span id="kw_count" style="color:rgba(255,255,255,.7)">0</span></span>
    </div>
    <div class="kw-list" id="kw_list">
      <div style="font-size:12px;color:rgba(255,255,255,.3);text-align:center;padding:20px 0">키워드를 추가하세요</div>
    </div>
  </div>

  <!-- 우측 메인 -->
  <div class="right">
    <div class="right-header">
      <div>
        <div class="page-title">🔍 발굴 결과</div>
        <div class="page-sub">점수가 높을수록 좋은 기회입니다</div>
      </div>
      <div class="toolbar">
        <input type="text" class="search-box" id="search_box" placeholder="🔍 상품 검색..." oninput="renderItems()">
        <button class="btn btn-sec" style="width:auto;padding:8px 18px" onclick="loadItems()">↻ 새로고침</button>
      </div>
    </div>

    <div class="run-info" id="run_info" style="display:none">
      <div class="run-info-text">마지막 수집: <span class="run-info-time" id="last_run">-</span></div>
      <div class="run-info-text"><span id="last_run_status"></span></div>
    </div>

    <div class="stat-cards">
      <div class="stat-card"><div class="stat-label">발굴 상품</div><div class="stat-val" id="s_total">0</div></div>
      <div class="stat-card"><div class="stat-label">즐겨찾기</div><div class="stat-val" id="s_fav" style="color:#e8a020">0</div></div>
      <div class="stat-card"><div class="stat-label">평균 점수</div><div class="stat-val green" id="s_avg">-</div></div>
      <div class="stat-card"><div class="stat-label">평균 KR 비율</div><div class="stat-val" id="s_kr">-</div></div>
    </div>

    <div class="filter-bar" id="filter_bar">
      <button class="fbtn active" onclick="setFilter('all')">전체</button>
      <button class="fbtn" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
      <button class="fbtn" onclick="setFilter('top')">🏆 점수 Top 20</button>
      <button class="fbtn" onclick="setFilter('low_kr')">🇰🇷 KR 30% 이하</button>
      <button class="fbtn" onclick="setFilter('high_score')">💎 점수 1000+</button>
    </div>

    <div id="items_container">
      <div class="empty">
        <div class="empty-em">🔍</div>
        <div>아직 발굴된 상품이 없습니다</div>
        <div style="font-size:11px;color:#bbb;margin-top:8px">좌측에서 키워드를 추가하고<br>로컬 PC에서 스크래퍼를 실행하세요</div>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// Supabase
// ════════════════════════════════════════
const SUPABASE_URL = 'https://erqhwzsmvhxnexpctcpo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fGWhhTFU8iMNpZA77Ql7jA_fEMJUjxX';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let keywords = [];
let items = [];
let activeFilter = 'all';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg; el.className = 'auth-msg ' + type; el.style.display = 'block';
}

// ════════════════════════════════════════
// 로그인 / 로그아웃
// ════════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('login_id').value.trim();
  const pw = document.getElementById('login_pw').value;
  if (!username || !pw) { showMsg('login_msg','아이디와 비밀번호를 입력해주세요','err'); return; }
  const btn = document.getElementById('login_btn');
  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    const hash = await sha256(pw);
    const { data, error } = await sb.from('profiles').select('*').eq('username', username).eq('password_hash', hash).single();
    if (error || !data) { showMsg('login_msg','아이디 또는 비밀번호가 틀렸습니다','err'); return; }
    if (data.status === 'pending') { showMsg('login_msg','⏳ 관리자 승인 대기 중입니다','warn'); return; }
    if (data.status === 'rejected') { showMsg('login_msg','❌ 가입이 거절된 계정입니다','err'); return; }
    currentUser = data;
    localStorage.setItem('ef_session', JSON.stringify({ id: data.id, username: data.username }));
    enterApp();
  } catch(e) {
    showMsg('login_msg', '오류: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
}

function logout() {
  currentUser = null;
  keywords = []; items = [];
  localStorage.removeItem('ef_session');
  document.getElementById('auth_wrap').style.display = 'flex';
  document.getElementById('main_app').style.display = 'none';
  document.getElementById('login_id').value = '';
  document.getElementById('login_pw').value = '';
  document.getElementById('login_msg').style.display = 'none';
}

async function enterApp() {
  document.getElementById('auth_wrap').style.display = 'none';
  document.getElementById('main_app').style.display = 'grid';
  document.getElementById('current_user_label').textContent = '👤 ' + currentUser.username;
  await loadKeywords();
  await loadItems();
  await loadLastRun();
}

// ════════════════════════════════════════
// 키워드 관리
// ════════════════════════════════════════
async function loadKeywords() {
  const { data } = await sb.from('er_keywords')
    .select('*').eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  keywords = data || [];
  renderKeywords();
}

function renderKeywords() {
  document.getElementById('kw_count').textContent = keywords.length;
  const el = document.getElementById('kw_list');
  if (!keywords.length) {
    el.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.3);text-align:center;padding:20px 0">키워드를 추가하세요</div>';
    return;
  }
  el.innerHTML = keywords.map(k => {
    const meta = [];
    if (k.category) meta.push('📁 ' + k.category);
    if (k.min_price || k.max_price) meta.push('$' + (k.min_price||'?') + '~' + (k.max_price||'?'));
    return `
      <div class="kw-card ${k.is_active ? '' : 'inactive'}">
        <div class="kw-info">
          <div class="kw-name">${k.keyword}</div>
          ${meta.length ? `<div class="kw-meta">${meta.join(' · ')}</div>` : ''}
        </div>
        <div class="kw-actions">
          <button class="kw-btn" onclick="toggleKeyword(${k.id}, ${!k.is_active})" title="${k.is_active?'비활성':'활성'}">${k.is_active?'⏸':'▶'}</button>
          <button class="kw-btn danger" onclick="deleteKeyword(${k.id})" title="삭제">×</button>
        </div>
      </div>
    `;
  }).join('');
}

async function addKeyword() {
  const keyword = document.getElementById('new_kw').value.trim();
  if (!keyword) { alert('키워드를 입력해주세요'); return; }
  const category = document.getElementById('new_cat').value.trim() || null;
  const min_price = parseFloat(document.getElementById('new_min').value) || null;
  const max_price = parseFloat(document.getElementById('new_max').value) || null;

  const { error } = await sb.from('er_keywords').insert({
    user_id: currentUser.id, keyword, category, min_price, max_price, is_active: true,
  });
  if (error) {
    if (error.code === '23505') alert('이미 등록된 키워드입니다');
    else alert('오류: ' + error.message);
    return;
  }
  document.getElementById('new_kw').value = '';
  document.getElementById('new_cat').value = '';
  document.getElementById('new_min').value = '';
  document.getElementById('new_max').value = '';
  await loadKeywords();
}

async function toggleKeyword(id, newActive) {
  await sb.from('er_keywords').update({ is_active: newActive }).eq('id', id);
  await loadKeywords();
}

async function deleteKeyword(id) {
  const kw = keywords.find(k => k.id === id);
  if (!confirm(`"${kw.keyword}" 키워드와 관련 발굴 결과를 모두 삭제할까요?`)) return;
  await sb.from('er_keywords').delete().eq('id', id);
  await loadKeywords();
  await loadItems();
}

// ════════════════════════════════════════
// 발굴 결과
// ════════════════════════════════════════
async function loadItems() {
  const { data } = await sb.from('er_research_items')
    .select('*').eq('user_id', currentUser.id)
    .eq('is_dismissed', false)
    .order('score', { ascending: false, nullsFirst: false })
    .limit(500);
  items = data || [];
  renderItems();
  renderStats();
}

function renderStats() {
  document.getElementById('s_total').textContent = items.length;
  document.getElementById('s_fav').textContent = items.filter(i => i.is_favorited).length;
  const scores = items.filter(i => i.score).map(i => Number(i.score));
  const avg = scores.length ? scores.reduce((a,b)=>a+b,0) / scores.length : 0;
  document.getElementById('s_avg').textContent = avg ? avg.toFixed(0) : '-';
  const krs = items.filter(i => i.kr_seller_ratio != null).map(i => Number(i.kr_seller_ratio));
  const krAvg = krs.length ? krs.reduce((a,b)=>a+b,0) / krs.length : null;
  document.getElementById('s_kr').textContent = krAvg != null ? krAvg.toFixed(1) + '%' : '-';
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach((b,i)=>{
    b.classList.toggle('active', ['all','fav','top','low_kr','high_score'][i] === f);
  });
  renderItems();
}

function getFilteredItems() {
  const q = (document.getElementById('search_box')?.value || '').toLowerCase().trim();
  let arr = items.slice();
  if (q) arr = arr.filter(i => (i.title||'').toLowerCase().includes(q));
  switch (activeFilter) {
    case 'fav': arr = arr.filter(i => i.is_favorited); break;
    case 'top': arr = arr.slice(0, 20); break;
    case 'low_kr': arr = arr.filter(i => i.kr_seller_ratio != null && i.kr_seller_ratio <= 30); break;
    case 'high_score': arr = arr.filter(i => i.score >= 1000); break;
  }
  return arr;
}

function renderItems() {
  const arr = getFilteredItems();
  const el = document.getElementById('items_container');
  if (!arr.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-em">📭</div>
        <div>${items.length ? '조건에 맞는 상품이 없습니다' : '아직 발굴된 상품이 없습니다'}</div>
        ${!items.length ? '<div style="font-size:11px;color:#bbb;margin-top:8px">좌측에서 키워드를 추가하고<br>로컬 PC에서 스크래퍼를 실행하세요</div>' : ''}
      </div>`;
    return;
  }
  el.innerHTML = '<div class="items-grid">' + arr.map(it => {
    const krClass = it.kr_seller_ratio == null ? '' :
                    it.kr_seller_ratio <= 30 ? 'low' :
                    it.kr_seller_ratio <= 50 ? 'mid' : 'high';
    const ebaySearchUrl = 'https://www.ebay.com/sch/i.html?_nkw=' + encodeURIComponent(it.title);
    const musinsaUrl = 'https://www.musinsa.com/search/musinsa/goods?q=' + encodeURIComponent(it.title);
    return `
      <div class="item-card">
        ${it.thumbnail_url ? `<img class="item-thumb" src="${it.thumbnail_url}" loading="lazy" onerror="this.style.display='none'">` : `<div class="item-thumb" style="display:flex;align-items:center;justify-content:center;color:#ccc">📦</div>`}
        <div class="item-body">
          ${it.score ? `<div class="item-score">점수 ${Number(it.score).toFixed(0)}</div>` : ''}
          <div class="item-title" title="${it.title}">${it.title}</div>
          <div class="item-stats">
            <div class="item-stat"><div class="item-stat-label">90일 판매</div><div class="item-stat-val">${it.sold_count_90d || '?'}개</div></div>
            <div class="item-stat"><div class="item-stat-label">평균가</div><div class="item-stat-val">$${it.avg_sold_price_usd || '?'}</div></div>
            <div class="item-stat"><div class="item-stat-label">활성 리스팅</div><div class="item-stat-val">${it.active_listings || '?'}</div></div>
            <div class="item-stat"><div class="item-stat-label">KR 셀러</div><div class="item-stat-val">${it.kr_seller_ratio != null ? `<span class="item-kr ${krClass}">${it.kr_seller_ratio}%</span>` : '?'}</div></div>
          </div>
          <div class="item-actions">
            <button class="iact fav ${it.is_favorited?'active':''}" onclick="toggleFav(${it.id}, ${!it.is_favorited})">${it.is_favorited?'★':'☆'} 즐찾</button>
            <button class="iact" onclick="window.open('${ebaySearchUrl}','_blank')">eBay</button>
            <button class="iact" onclick="window.open('${musinsaUrl}','_blank')">소싱검색</button>
            <button class="iact" onclick="dismissItem(${it.id})" title="숨기기">✕</button>
          </div>
        </div>
      </div>
    `;
  }).join('') + '</div>';
}

async function toggleFav(id, newFav) {
  await sb.from('er_research_items').update({ is_favorited: newFav }).eq('id', id);
  const it = items.find(i => i.id === id);
  if (it) it.is_favorited = newFav;
  renderItems();
  renderStats();
}

async function dismissItem(id) {
  await sb.from('er_research_items').update({ is_dismissed: true }).eq('id', id);
  items = items.filter(i => i.id !== id);
  renderItems();
  renderStats();
}

// ════════════════════════════════════════
// 실행 로그
// ════════════════════════════════════════
async function loadLastRun() {
  const { data } = await sb.from('er_scrape_runs')
    .select('*').eq('user_id', currentUser.id)
    .order('started_at', { ascending: false }).limit(1);
  if (!data || !data.length) return;
  const r = data[0];
  document.getElementById('run_info').style.display = 'flex';
  const date = new Date(r.finished_at || r.started_at);
  document.getElementById('last_run').textContent = date.toLocaleString('ko-KR');
  const statusEl = document.getElementById('last_run_status');
  if (r.status === 'success') {
    statusEl.innerHTML = `<span style="color:#2d6a4f;font-weight:800">✓ 성공</span> · ${r.items_collected || 0}개 수집`;
  } else if (r.status === 'failed') {
    statusEl.innerHTML = `<span style="color:#e55;font-weight:800">✗ 실패</span> · ${r.error_message || ''}`;
  } else {
    statusEl.innerHTML = `<span style="color:#888">실행 중...</span>`;
  }
}

// ════════════════════════════════════════
// 자동 로그인 복원
// ════════════════════════════════════════
window.addEventListener('load', () => {
  const sess = localStorage.getItem('ef_session');
  if (sess) {
    try {
      const s = JSON.parse(sess);
      sb.from('profiles').select('*').eq('id', s.id).single().then(({ data }) => {
        if (data && data.status === 'approved') {
          currentUser = data;
          enterApp();
        } else {
          localStorage.removeItem('ef_session');
        }
      });
    } catch(e) { localStorage.removeItem('ef_session'); }
  }
});
</script>
